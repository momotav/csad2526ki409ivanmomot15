name: CI Pipeline

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'
  workflow_dispatch:
    inputs:
      target_os:
        description: "Select OS to build"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

jobs:
  cross_build:
    name: Cross-platform CMake build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Run build script (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./ci.sh
          bash ./ci.sh

      - name: Run build script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\ci.cmd

      - name: Deploy (placeholder)
        if: success()
        run: echo "Deploy step placeholder"
